[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "c9r"
version = "0.8"
description = "Reproducible pipeline for music scrobble ingestion, artist-name record linkage, and interactive analytics."
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Torda Bal\u00e1zs", email = "balazs.torda@iu-study.org"}]
dependencies = [
  "apache-airflow>=3.2.0",
  "click>=8.1",
  "cryptography>=46.0.7",
  "duckdb>=1.2",
  "fastapi>=0.115",
  "gitpython>=3.1.50",
  "idna>=3.15",
  "lightgbm>=4.5",
  "mako>=1.3.12",
  "matplotlib>=3.9",
  "mlflow>=3.11.1",
  "musicbrainzngs>=0.7.1",
  "numpy>=2.0",
  "optuna>=4.0",
  "orjson>=3.11.4",
  "pandas>=2.2",
  "pillow>=12.2.0",
  "prefect>=3.6.28.dev2",
  "pyarrow>=23.0.1",
  "pyasn1>=0.6.3",
  "pygments>=2.20.0",
  "pypopulation>=2020.3",
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "rapidfuzz>=3.14",
  "requests>=2.33.0",
  "scikit-learn>=1.6",
  "seaborn>=0.13",
  "shap>=0.46",
  "tenacity>=9.1",
  "torch>=2.10.0",
  "urllib3>=2.7.0",
  "uvicorn>=0.34",
  "xgboost>=3.0",
]

[project.optional-dependencies]
prefect = ["prefect>=3.0"]
dev = ["httpx>=0.27", "pytest>=8.4", "pytest-cov>=7.0.0", "ruff>=0.9"]
all = ["httpx>=0.27", "prefect>=3.0", "pytest>=8.4", "pytest-cov>=7.0.0", "ruff>=0.9"]

[project.scripts]
c9r = "main:cli"

[tool.hatch.build.targets.wheel]
packages = [
  "HTTP",
  "corefunc",
  "helpers",
]

[tool.hatch.build.targets.sdist]
include = [
  "HTTP",
  "corefunc",
  "helpers",
  "main.py",
  "README.md",
  "LICENSE*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: marks tests that hit real services or need external deps (deselected by default)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "dev/*",
    "scripts/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

