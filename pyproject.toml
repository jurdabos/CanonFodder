[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "c9r"
version = "0.8"
description = "Reproducible pipeline for music scrobble ingestion, artist-name record linkage, and interactive analytics."
# Upper-bound excludes 3.14: ruamel-yaml-clib 0.2.12 (transitive via prefect) uses
# `from ast import Str`, which was removed in Python 3.12+ and never reinstated.
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Torda Bal\u00e1zs", email = "balazs.torda@iu-study.org"}]
dependencies = [
  "aiohttp>=3.14.0",
  "click>=8.1",
  "cryptography>=48.0.1",
  "duckdb>=1.2",
  "fastapi>=0.115",
  "gitpython>=3.1.50",
  "idna>=3.15",
  "lightgbm>=4.5",
  "mako>=1.3.12",
  "matplotlib>=3.9",
  "mlflow>=3.11.1",
  "musicbrainzngs>=0.7.1",
  "numpy>=2.0",
  "optuna>=4.0",
  "orjson>=3.11.4",
  "pandas>=2.2",
  "pillow>=12.2.0",
  "prefect>=3.6.28.dev2",
  "pyarrow>=23.0.1",
  "pyasn1>=0.6.3",
  "pygments>=2.20.0",
  "pypopulation>=2020.3",
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "rapidfuzz>=3.14",
  "requests>=2.33.0",
  "scikit-learn>=1.6",
  "seaborn>=0.13",
  "shap>=0.46",
  "starlette>=1.3.1",
  "tenacity>=9.1",
  "torch>=2.10.0",
  "urllib3>=2.7.0",
  "uvicorn>=0.34",
  "xgboost>=3.0",
]

[project.optional-dependencies]
prefect = ["prefect>=3.0"]
dev = ["httpx>=0.27", "pytest>=8.4", "pytest-cov>=7.0.0", "ruff>=0.9"]
all = ["httpx>=0.27", "prefect>=3.0", "pytest>=8.4", "pytest-cov>=7.0.0", "ruff>=0.9"]

[project.scripts]
c9r = "main:cli"

[tool.hatch.build.targets.wheel]
packages = [
  "HTTP",
  "corefunc",
  "helpers",
]

[tool.hatch.build.targets.sdist]
include = [
  "HTTP",
  "corefunc",
  "helpers",
  "main.py",
  "README.md",
  "LICENSE*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: marks tests that hit real services or need external deps (deselected by default)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "dev/*",
    "scripts/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

# Canonical ruff configuration for the a6a ecosystem (mirrors acidbase templates/pyproject.lint.toml).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Conservative starting selection that mirrors the legacy flake8 + isort
# coverage. Broaden to ["E","W","F","I","B","UP","SIM","RUF"] per repo once
# the existing code is clean (use `ruff check --fix` / `--unsafe-fixes` first).
# E,W = pycodestyle       F = pyflakes (incl. F401/F541/F821)       I = isort
select = ["E", "W", "F", "I"]
# E203 conflicts with the ruff formatter; ruff itself doesn't emit W503 (that's flake8-only).
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Long string fixtures and import-only test stubs are acceptable.
"tests/**/*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]
# Frozen one-off experiment scripts — not worth re-wrapping historical output lines.
"scripts/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.sources]
acidbase = { git = "https://github.com/jurdabos/acidbase" }

[dependency-groups]
dev = [
    "acidbase",
    "fpdf2>=2.8.7",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

