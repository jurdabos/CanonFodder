# Canonical pre-commit config for the a6a ecosystem (+ repo-specific uv-export).
# Bump revs with: pre-commit autoupdate
repos:
  # fast uv-powered helpers maintained by Astral
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.15
    hooks:
      - id: uv-lock           # keep uv.lock fresh
      - id: uv-export         # keep requirements.txt synced (optional)

  # Single unified linter + formatter (replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning (MIT CLI, no license gate)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
