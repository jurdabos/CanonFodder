name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

    - name: Install uv
      uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883  # v7

    - name: Lint Python code
      run: uvx ruff check HTTP/ corefunc/ helpers/ flows/ main.py tests/

    - name: Check Python formatting
      run: uvx ruff format --check HTTP/ corefunc/ helpers/ flows/ main.py tests/

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

    - name: Install uv
      uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883  # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra all

    - name: Run unit tests with coverage
      run: >
        uv run pytest tests/unit/ -v --tb=short
        --cov=. --cov-report=term-missing --cov-report=xml
        --cov-fail-under=80

    - name: Upload coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

    - name: Install uv
      uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883  # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra all

    - name: Run integration tests
      run: >
        uv run pytest tests/integration/ tests/test_prefect_flow.py
        -v --tb=short
