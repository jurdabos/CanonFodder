name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linting and secret scanning live in lint.yml (canonical a6a baseline).
jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

    - name: Install uv
      uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883  # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      # CPU-only torch on the CUDA-less runner (gpu group carries the CUDA build).
      run: uv sync --frozen --extra all --no-group gpu --group cpu

    - name: Run unit tests with coverage
      run: >
        uv run pytest tests/unit/ -v --tb=short
        --cov=. --cov-report=term-missing --cov-report=xml
        --cov-fail-under=80

    - name: Upload coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

    - name: Install uv
      uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883  # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      # CPU-only torch on the CUDA-less runner (gpu group carries the CUDA build).
      run: uv sync --frozen --extra all --no-group gpu --group cpu

    - name: Run integration tests
      run: >
        uv run pytest tests/integration/ tests/test_prefect_flow.py
        -v --tb=short --no-cov
