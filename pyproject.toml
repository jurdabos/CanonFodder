[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "canonfodder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "numpy",
  "matplotlib",
  "seaborn",
  "requests",
  "openai>=1.60.2",
  "h11>=0.16.0",
  "httpcore>=1.0.7",
  "httpx>=0.28.1",
  "Jinja2>=3.1.6",
  "pytest>=8.4.2",
  "sqlalchemy>=2.0.43",
  "python-dotenv>=1.1.1",
  "pymysql>=1.1.2",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0.40", "alembic>=1.15.2"]
prefect = ["prefect>=3.0", "prefect-sqlalchemy>=0.5.0"]
all = ["sqlalchemy>=2.0.40", "alembic>=1.15.2", "prefect>=3.0", "prefect-sqlalchemy>=0.5.0"]

[project.scripts]
canonfodder = "main:_cli_entry"

[tool.hatch.build.targets.wheel]
# Using flat layout: list top-level package directories to include
packages = [
  "CSV",
  "DB",
  "HTTP",
  "PQ",
  "corefunc",
  "helpers",
]

[tool.hatch.build.targets.sdist]
# Include the same package directories in sdist
include = [
  "CSV",
  "DB",
  "HTTP",
  "PQ",
  "corefunc",
  "helpers",
  "README.md",
  "LICENSE*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    "env/*",
    "*/site-packages/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

