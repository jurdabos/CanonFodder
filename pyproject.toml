[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "c9r"
version = "0.6.0"
description = "Reproducible pipeline for music scrobble ingestion, artist-name record linkage, and interactive analytics."
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Torda Bal\u00e1zs", email = "balazs.torda@iu-study.org"}]
dependencies = [
  "click>=8.1",
  "duckdb>=1.2",
  "fastapi>=0.115",
  "matplotlib>=3.9",
  "musicbrainzngs>=0.7.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "python-dotenv>=1.1",
  "rapidfuzz>=3.14",
  "requests>=2.32",
  "scikit-learn>=1.6",
  "seaborn>=0.13",
  "tenacity>=9.1",
  "uvicorn>=0.34",
  "xgboost>=3.0",
]

[project.optional-dependencies]
prefect = ["prefect>=3.0"]
dev = ["httpx>=0.27", "pytest>=8.4", "pytest-cov>=6.0", "ruff>=0.9"]
all = ["httpx>=0.27", "prefect>=3.0", "pytest>=8.4", "pytest-cov>=6.0", "ruff>=0.9"]

[project.scripts]
c9r = "main:cli"

[tool.hatch.build.targets.wheel]
packages = [
  "HTTP",
  "corefunc",
  "helpers",
]

[tool.hatch.build.targets.sdist]
include = [
  "HTTP",
  "corefunc",
  "helpers",
  "main.py",
  "README.md",
  "LICENSE*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "dev/*",
    "scripts/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

